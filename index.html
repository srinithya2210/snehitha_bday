footer{font:.72rem var(--sans);letter-spacing:.14em;color:#6f7b70;text-align:center;padding:1.4rem}
@media(max-width:700px){body{font-size:17px}.bar{grid-template-columns:1fr auto}.bar i{grid-column:1/-1;order:3}.lamp:nth-child(4),.lamp:nth-child(5){display:none}.pl:last-child{grid-column:auto}.n19{opacity:.6}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

function Finale(){
